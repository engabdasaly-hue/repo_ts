name: A wf for my hello world file
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: 
    inputs:
      first_name:
        required: true
        default: 'Abdullah'
jobs:
  build:
   name: Hello world action
   runs-on: ubuntu-latest
   steps:
     - name: checkout
       uses: actions/checkout@v3
     - name: print event trigger
       run: echo "Triggered by ${{ github.event_name }}"
