---
name: Deploy env
on:
  push:
    branches:
      - Feature/*
  workflow_dispatch:
    inputs:
      first_name:
        required: true
        default: Abdullah
jobs:
  job_1:
    name: upload artifact
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello World" > file.txt
      - uses: actions/upload_artifact@v2
        with:
          name: file
          path: file.txt
  job_2:
    name: download artifact
    runs_on: ubuntu-latest
    needs: job_1
    steps:
      - uses: actions/download_artifact@v2
        with:
          name: file
      - run: cat file/txt
  build:
    environment:
      name: Production
    name: Hello world action
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: print event trigger
        run: echo "Triggered by ${{ github.event_name }}"
      - name: set the value
        run: echo "action_status=yellow" >> "$GITHUB_ENV"
      - name: use the value
        run: printf '%s\n' "$action_status"
